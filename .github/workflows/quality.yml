name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:db:infra
      - run: npm run test:commerce
      - run: npm run check
      - run: npm run check:jsonld
      - run: npm run check:indexation
      - run: npm run check:links
      - run: npm run check:service-seo
      - run: npm run check:service-mobile
      - run: npm run check:all-pages
      - run: npm audit --omit=dev --audit-level=high
