<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Pixon PC</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Red+Hat+Display:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/style.css">
    <style>
        body {
            background-color: #020617 !important; /* Premium Dark Mode */
            color: #f1f5f9 !important;
            background-image: radial-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px) !important;
            background-size: 30px 30px !important;
        }
        
        .admin-navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 1.2rem;
        }

        .admin-logo img {
            height: 40px;
            filter: brightness(0) invert(1);
        }

        .admin-header {
            padding: 40px 20px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .admin-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .admin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.4);
        }

        .admin-card.pending::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: #f59e0b; /* Warning color for pending */
        }

        .admin-card.approved::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: #10b981; /* Success color for approved */
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-user {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f8fafc;
        }

        .card-email {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2px;
            word-break: break-all;
        }

        .card-date {
            font-size: 0.75rem;
            color: #64748b;
        }

        .card-stars {
            color: #f59e0b;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .card-text {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            flex-grow: 1;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            /* Nuevas propiedades para compactar */
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
        }

        .card-text.expanded {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        
        .card-text:hover {
            background: rgba(0,0,0,0.3);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-admin {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .status-approved {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .filter-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: rgba(99, 102, 241, 0.2);
            color: #fff;
            border-color: #6366f1;
        }

        #empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-bottom: 20px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-live 2s infinite;
        }
        
        @keyframes pulse-live {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        /* Ocultar contenido hasta validar admin */
        #admin-content {
            display: none;
        }
        
        #auth-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: #cbd5e1;
            font-size: 1.2rem;
            gap: 15px;
        }

        /* Tabs Principales Admin */
        .admin-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            padding-bottom: 15px;
        }

        .admin-tab {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 10px 20px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .admin-tab:hover {
            color: #cbd5e1;
        }

        .admin-tab.active {
            color: #6366f1;
        }

        .admin-tab.active::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #6366f1;
            border-radius: 3px 3px 0 0;
        }

        /* Tabla de usuarios */
        .users-table-wrapper {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .users-table th, .users-table td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .users-table th {
            color: #6366f1;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .users-table td {
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .users-table tr:hover td {
            background: rgba(99, 102, 241, 0.05);
        }

        .user-role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .user-role-badge.admin {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        
        .user-phone-empty {
            color: #64748b;
            font-style: italic;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .admin-header h1 { font-size: 1.8rem; }
            .admin-header { padding: 20px 10px; }
            .admin-grid { grid-template-columns: 1fr; }
            .admin-tabs { flex-wrap: wrap; justify-content: center; }
            .users-table th, .users-table td { padding: 10px; font-size: 0.85rem; }
        }

    </style>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; block-all-mixed-content">
</head>
<body>

    <nav class="admin-navbar">
        <a href="/" class="admin-logo">
            <img src="/assets/logos/Logo.svg" alt="Pixon PC Logo">
            <span>Admin</span>
        </a>
        <div id="admin-user-area"></div>
    </nav>

    <div id="auth-loading">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #6366f1;"></i>
        <p>Verificando permisos...</p>
    </div>

    <div id="admin-content">
        <header class="admin-header">
            <h1>Panel de Administración</h1>
            <p style="color: #94a3b8;" id="admin-subtitle">Revisa, aprueba y gestiona tu plataforma.</p>
            <div class="live-indicator" id="live-indicator" style="display: none;">
                <div class="live-dot"></div> Conectado en tiempo real
            </div>
        </header>

        <main class="admin-container">
            <div class="admin-tabs">
                <button class="admin-tab active" data-view="comments">Comentarios</button>
                <button class="admin-tab" data-view="users">Usuarios</button>
            </div>

            <!-- VISTA COMENTARIOS -->
            <div id="view-comments">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="pending">Pendientes</button>
                    <button class="filter-btn" data-filter="approved">Aprobados</button>
                </div>

                <div class="admin-grid" id="comments-grid">
                    <!-- Comentarios se renderizan aquí -->
                </div>
            </div>

            <!-- VISTA USUARIOS -->
            <div id="view-users" style="display: none;">
                <div class="users-table-wrapper">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Celular</th>
                                <th>Rol</th>
                                <th>Fecha de Registro</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <!-- Usuarios se renderizan aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/admin.js"></script>
    <script type="module" src="/user-menu.js"></script>
</body>
</html>
